name: mobile
description: "Contact Bridge - Telegram Contacts Sync & Merge (SRS v2.0)"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  url_launcher: ^6.3.1

  core_domain:
    path: ../../packages/core_domain
  core_phone:
    path: ../../packages/core_phone
  match_engine:
    path: ../../packages/match_engine
  source_telegram:
    path: ../../packages/source_telegram
  sink_phonebook:
    path: ../../packages/sink_phonebook
  platform_security:
    path: ../../packages/platform_security
  design_system:
    path: ../../packages/design_system
  l10n:
    path: ../../packages/l10n
  ads_noop:
    path: ../../packages/ads_noop
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  tapsell_mediation: 1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
