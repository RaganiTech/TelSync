name: sink_phonebook
description: Native phonebook reader and writer adapter via Pigeon for contact_bridge.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_domain:
    path: ../core_domain
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.contactbridge.sink_phonebook
        pluginClass: SinkPhonebookPlugin
      ios:
        pluginClass: SinkPhonebookPlugin
